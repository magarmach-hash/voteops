name: CI - Build & Update Image Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.diff.outputs.app_changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          [ "$BEFORE" = "0000000000000000000000000000000000000000" ] && BEFORE="HEAD~1"
          if git diff --name-only "$BEFORE" ${{ github.sha }} | grep -q '^voting-app/app/'; then
            echo "app_changed=true" >> $GITHUB_OUTPUT
          else
            echo "app_changed=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./voting-app/app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/voting-app:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/voting-app:latest

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Update deployment image
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/voting-app:$TAG|" voting-app/k8s/deployment.yaml

      - name: Commit changes
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voting-app/k8s/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: update image tag to $TAG [skip ci]"
          git push
