  <button class="submit-btn" id="submitBtn" onclick="submitVote()" disabled>Submit Vote</button>
  <div class="toast" id="toast"></div>

  <hr class="divider" />

  <div class="results-title">
    Live Results
    <button class="refresh-btn" onclick="loadResults()">↻ Refresh</button>
  </div>
  <div id="results">Loading...</div>
</div>

<script>
  let selectedOption = null;

  function selectOption(btn, option) {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedOption = option;
    document.getElementById('submitBtn').disabled = false;
  }

  async function submitVote() {
    if (!selectedOption) return;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    try {
      const res = await fetch('/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ option: selectedOption })
      });
      const data = await res.json();
      const toast = document.getElementById('toast');
      if (res.ok) {
        toast.className = 'toast success';
        toast.textContent = '✅ ' + data.message;
        selectedOption = null;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        loadResults();
      } else {
        toast.className = 'toast error';
        toast.textContent = '❌ ' + (data.error || 'Something went wrong');
        btn.disabled = false;
      }
    } catch (e) {
      document.getElementById('toast').className = 'toast error';
      document.getElementById('toast').textContent = '❌ Network error';
      btn.disabled = false;
    }
    btn.textContent = 'Submit Vote';
  }

  async function loadResults() {
    try {
      const res = await fetch('/results');
      const data = await res.json();
      const el = document.getElementById('results');
      if (!data.results) { el.textContent = 'Could not load results.'; return; }
      const total = data.total || 1;
      el.innerHTML = Object.entries(data.results).map(([opt, count]) => {
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        return `<div class="bar-wrap">
          <div class="bar-label"><span>${opt}</span><span>${count} votes (${pct}%)</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join('');
    } catch (e) {
      document.getElementById('results').textContent = 'Could not load results.';
    }
  }

  loadResults();
  setInterval(loadResults, 10000);
</script>
</body>
