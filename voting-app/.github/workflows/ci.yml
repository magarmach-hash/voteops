name: CI - Build & Update Image Tag

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect App Changes
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.diff.outputs.app_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if app/ changed
        id: diff
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^app/"; then
            echo "app_changed=true" >> $GITHUB_OUTPUT
          else
            echo "app_changed=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        id: meta
        run: |
          TAG=$(echo $GITHUB_SHA | cut -c1-7)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/voting-app:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/voting-app:latest

  update-variables:
    name: Update Image Tag in variables.yaml & deployment.yaml
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Update APP_TAG in variables.yaml
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          sed -i "s/^APP_TAG: .*/APP_TAG: $TAG/" k8s/variables.yaml

      - name: Update image in deployment.yaml
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          REPO=$(grep '^APP_IMAGE:' k8s/variables.yaml | awk '{print $2}')
          sed -i "s|image: .*|image: $REPO:$TAG|" k8s/deployment.yaml

      - name: Commit and push updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/variables.yaml k8s/deployment.yaml
          git commit -m "ci: update image tag to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push
